name: Refresh AI news

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install certifi

      - name: Fetch latest news
        run: python fetch_news.py

      - name: Fetch latest stock quotes
        run: python fetch_stocks.py

      - name: Fetch trending AI videos
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python fetch_videos.py

      - name: Commit and push if content changed
        run: |
          git config user.name "aistreamonline-bot"
          git config user.email "actions@users.noreply.github.com"

          git add news.json stocks.json archive/
          if [ -f videos.json ]; then
            git add videos.json
          fi

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Auto-refresh news, stock quotes, and trending videos"
          git push
