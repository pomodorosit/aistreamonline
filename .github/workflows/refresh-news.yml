name: Refresh AI news

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install certifi

      - name: Fetch latest news
        run: python fetch_news.py

      - name: Commit and push if news.json changed
        run: |
          if git diff --quiet -- news.json; then
            echo "No news changes"
            exit 0
          fi
          git config user.name "aistreamonline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add news.json
          git commit -m "Auto-refresh news"
          git push
